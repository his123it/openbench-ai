name: Publish to PyPI

# Builds the sdist and wheel from a release tag and uploads them to PyPI using
# trusted publishing (OIDC), so no API token is stored in the repository.
# One-time setup on PyPI: add a trusted publisher for this repository with the
# workflow file name "publish.yml" and the environment name "pypi".

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to build and publish (for example v0.4.0)"
        required: true
        default: "v0.4.0"

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir dist .
          python -m twine check --strict dist/*
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/python -m pip install dist/*.whl
          /tmp/wheelenv/bin/openbench --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openbench-ai/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
