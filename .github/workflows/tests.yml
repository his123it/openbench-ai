name: Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  test:
    name: Pytest & CLI Smoke (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core + dev + config + metrics dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,config,metrics]"

      - name: Validate all 10 built-in datasets
        run: python scripts/validate_datasets.py

      - name: Run pytest suite
        run: pytest -v

      - name: Run CLI smoke tests (v0.1.0 & v0.2.0 commands)
        run: |
          openbench --version
          openbench list-datasets
          openbench inspect-dataset datasets/mathematics/sample.jsonl --samples 1
          openbench dataset-stats datasets/
          openbench validate-dataset datasets/
          openbench evaluate --config configs/reasoning.yaml --responses examples/sample_responses.json --output results/
          openbench history list --store results/history.jsonl
          openbench export --input results/alphabaseline-7b.json --format csv --output results/exported.csv
