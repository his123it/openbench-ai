[build-system]
requires = ["setuptools>=65.0", "wheel", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "openbench-ai"
version = "0.4.0"
description = "A modular, open-source LLM experiment execution, evaluation, statistical comparison, and benchmarking platform."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Lakshay Chhaba" }
]
keywords = ["llm", "evaluation", "benchmarking", "ai", "metrics", "reproducibility", "experiments", "statistics", "human-preference"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lakshaychhaba0001-sys/openbench-ai"
Repository = "https://github.com/lakshaychhaba0001-sys/openbench-ai.git"
Issues = "https://github.com/lakshaychhaba0001-sys/openbench-ai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "ruff>=0.4.0,<1.0.0",
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.18.0,<5.0.0",
]
huggingface = [
    "transformers>=4.35.0,<5.0.0",
    "torch>=2.0.0,<3.0.0",
]
config = [
    "PyYAML>=6.0,<7.0",
]
metrics = [
    "jsonschema>=4.18.0,<5.0.0",
]
semantic = [
    "sentence-transformers>=2.2.0,<4.0.0",
]
# Reference libraries for the statistical cross-check tests only (tests/reference).
# OpenBench library code never imports them; they are not runtime dependencies.
stats-ref = [
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
]
all = [
    "pytest>=7.4.0,<9.0.0",
    "ruff>=0.4.0,<1.0.0",
    "PyYAML>=6.0,<7.0",
    "jsonschema>=4.18.0,<5.0.0",
    "sentence-transformers>=2.2.0,<4.0.0",
    "transformers>=4.35.0,<5.0.0",
    "torch>=2.0.0,<3.0.0",
]

[project.scripts]
openbench = "openbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openbench = ["py.typed", "quality_notes.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -W error::SyntaxWarning"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["openbench"]
